<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#082e3b">
  <meta name="description" content="Nusa Air Rally. Fly the Cendrawasih-1 through a sunlit island archipelago, then bring her home.">
  <title>Nusa Air Rally — A little plane. A whole archipelago.</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #082e3b; }
    body { font-family: Arial, sans-serif; color: #fff5d9; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #touch { position: fixed; bottom: 15px; right: 16px; display: none; gap: 9px; }
    #touch button { border: 1px solid #85e7d2; border-radius: 12px; color: #fff5d9; background: #082e3be8; padding: 16px; font: bold 13px Arial, sans-serif; touch-action: none; }
    @media (pointer: coarse) { html[data-screen="play"] #touch, html[data-screen="paused"] #touch { display: flex; } }
  </style>
</head>
<body>
  <canvas id="flight" tabindex="0" aria-label="Nusa Air Rally flight game. Arrow keys or WASD steer. Shift and Control adjust throttle. Hold the mouse to steer. Enter selects. P pauses."></canvas>
  <div id="touch" aria-label="Touch flight controls">
    <button data-control="slower" aria-label="Reduce throttle">− THR</button>
    <button data-control="faster" aria-label="Increase throttle">+ THR</button>
    <button data-control="brake" aria-label="Airbrake">BRAKE</button>
    <button data-action="pause" aria-label="Pause">Ⅱ</button>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
